<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Concept for CCFW Immigration · Landbot</title>
<style>
  :root { --bar:#0b0b14; --accent:#7c5cff; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#ffffff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .concept-bar { position:fixed; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center; gap:10px; justify-content:flex-start;
    padding:9px 16px; background:var(--bar); color:#fff; font-size:13px; line-height:1.3; text-align:center; }
  .concept-bar b { color:#c9bcff; font-weight:600; }
  .concept-bar .dot { width:8px; height:8px; border-radius:50%; background:#5ef0a3; box-shadow:0 0 0 4px rgba(94,240,163,.18); flex:none; }
  .site { position:relative; padding-top:38px; user-select:none; }
  .site img { display:block; width:100%; height:auto; pointer-events:none; }
  .site .m { display:none; }
  .site::after { content:""; position:absolute; inset:38px 0 0 0; } /* nada de la captura es clicable */
  .shot { position:relative; }
  .hot { position:absolute; z-index:2; display:block; border-radius:6px; cursor:pointer; background:transparent; border:0; padding:0; }
  .hot:hover, .hot:focus-visible { box-shadow:0 0 0 3px #fff, 0 0 0 6px #d9272d; outline:none; }
  .hint { position:absolute; z-index:3; left:13.9%; top:28.2%; background:#1f2433; color:#fff; font:600 12px/1.3 system-ui, sans-serif;
    padding:6px 10px; border-radius:4px; white-space:nowrap; }
  .hint::before { content:""; position:absolute; top:-5px; left:18px; border:5px solid transparent; border-top:0; border-bottom-color:#1f2433; }
  @media (max-width: 700px) { .shot { display:none; } }
  @media (max-width: 700px) { .site .d { display:none; } .site .m { display:block; } .concept-bar { font-size:12px; } }
</style>
</head>
<body>
  <div class="concept-bar"><span class="dot"></span><span><b>Concept by Landbot for CCFW Immigration</b> · not the live ccfwimmigration.com · the chat is a working demo</span></div>
  <div class="site">
    <div class="shot">
      <img class="d" src="site-desktop.jpg" alt="" aria-hidden="true">
      <button class="hot" style="left:62.85%;top:1.58%;width:17.36%;height:2.21%" aria-label="Schedule an appointment: open the chat"></button>
      <button class="hot" style="left:13.75%;top:24.76%;width:28.06%;height:2.85%" aria-label="Schedule an appointment: open the chat"></button>
      <button class="hot" style="left:6.25%;top:61.75%;width:24.38%;height:3.58%" aria-label="Schedule an appointment: open the chat"></button>
      <span class="hint">Now opens the appointment finder ↑</span>
    </div>
    <img class="m" src="site-mobile.jpg" alt="" aria-hidden="true">
  </div>
  <script>
    import('https://cdn.landbot.io/landbot-3/landbot-3.0.0.mjs').then(function () {
      var lb = new window.Landbot.Livechat({ configUrl: 'https://storage.googleapis.com/landbot.pro/v3/H-3538448-WT0U10MAZGNF7REQ/index.json' });
      var opened = false;
      function openOnce() { if (opened || window.innerWidth <= 700) return; opened = true; lb.open(); }
      lb.onLoad(function () { setTimeout(openOnce, 2500); });
      setTimeout(openOnce, 2500 + 6000); // onLoad no reproduce el evento si ya pasó
      // los CTA de la captura abren el chat, como haría la web real
      document.querySelectorAll('.hot').forEach(function (b) { b.addEventListener('click', function () { opened = true; lb.open(); }); });
    });
  </script>
</body>
</html>
